---
container_image_name: ghcr.io/mohamedelfaham96/mohamed-nginx-lab
container_image_tag: latest
container_full_image: "{{ container_image_name }}:{{ container_image_tag }}"

container_name: nginx-lab
container_host_port: 8080
container_internal_port: 80

container_restart_policy: always
container_pull_policy: always
container_build_directory: /opt/nginx-container
