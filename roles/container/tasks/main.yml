---
- name: Install Podman
  ansible.builtin.dnf:
    name: podman
    state: present
  tags:
    - container_packages

- name: Pull Nginx image from GHCR
  ansible.builtin.command:
    cmd: "podman pull {{ container_full_image }}"
  register: container_image_pull
  changed_when: false
  tags:
    - container
    - container_pull

- name: Get pulled image ID
  ansible.builtin.command:
    cmd: >-
      podman image inspect
      --format={{ '{{' }}.Id{{ '}}' }}
      {{ container_full_image }}
  register: container_pulled_image
  changed_when: false
  tags:
    - container

- name: Check whether Nginx container exists
  ansible.builtin.command:
    cmd: "podman container exists {{ container_name }}"
  register: container_exists
  changed_when: false
  failed_when: false
  tags:
    - container

- name: Get current container image ID
  ansible.builtin.command:
    cmd: >-
      podman inspect
      --format={{ '{{' }}.Image{{ '}}' }}
      {{ container_name }}
  register: container_current_image
  changed_when: false
  failed_when: false
  when: container_exists.rc == 0
  tags:
    - container

- name: Stop outdated Nginx container
  ansible.builtin.command:
    cmd: "podman stop {{ container_name }}"
  when:
    - container_exists.rc == 0
    - container_current_image.stdout | trim != container_pulled_image.stdout | trim
  tags:
    - container

- name: Remove outdated Nginx container
  ansible.builtin.command:
    cmd: "podman rm {{ container_name }}"
  when:
    - container_exists.rc == 0
    - container_current_image.stdout | trim != container_pulled_image.stdout | trim
  register: container_removed
  tags:
    - container

- name: Create Nginx container from GHCR image
  ansible.builtin.command:
    cmd: >-
      podman create
      --name {{ container_name }}
      --restart={{ container_restart_policy }}
      --publish {{ container_host_port }}:{{ container_internal_port }}
      {{ container_full_image }}
  when:
    - container_exists.rc != 0 or
      container_removed is changed
  tags:
    - container

- name: Check whether Nginx container is running
  ansible.builtin.command:
    cmd: >-
      podman inspect
      --format={{ '{{' }}.State.Running{{ '}}' }}
      {{ container_name }}
  register: container_running
  changed_when: false
  tags:
    - container

- name: Start Nginx container
  ansible.builtin.command:
    cmd: "podman start {{ container_name }}"
  when: container_running.stdout | trim != "true"
  tags:
    - container

- name: Enable Podman restart service
  ansible.builtin.service:
    name: podman-restart.service
    state: started
    enabled: true
  tags:
    - container

- name: Open container HTTP port
  ansible.posix.firewalld:
    port: "{{ container_host_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  tags:
    - container_firewall

- name: Wait for container HTTP endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ container_host_port }}"
    status_code: 200
    return_content: false
  register: container_health
  retries: 10
  delay: 3
  until: container_health.status == 200
  tags:
    - container_test
